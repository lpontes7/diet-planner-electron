name: Verificar e gerar aplicativo Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run make:windows
      - name: Testar o app.asar fora do repositório
        env:
          DIETAS_E2E_APP: out/DietasApp-win32-x64/resources/app.asar
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: DietasApp-Windows-x64
          path: |
            out/make/squirrel.windows/x64/*
            out/make/zip/win32/x64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-windows
          path: artifacts/
          if-no-files-found: ignore
